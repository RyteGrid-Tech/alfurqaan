<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="af-bg" cx="50%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#134234" />
      <stop offset="100%" stop-color="#07201a" />
    </radialGradient>
    <linearGradient id="af-gold" x1="10" y1="8" x2="54" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f0d592" />
      <stop offset="50%" stop-color="#c9a35c" />
      <stop offset="100%" stop-color="#a8813c" />
    </linearGradient>
  </defs>

  <!-- Deep Emerald Medallion Base -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#af-bg)" />
  <rect
    x="3.2"
    y="3.2"
    width="57.6"
    height="57.6"
    rx="12.8"
    stroke="url(#af-gold)"
    stroke-width="2"
    stroke-opacity="0.88"
  />
  <rect
    x="6.5"
    y="6.5"
    width="51"
    height="51"
    rx="9.5"
    stroke="#e2c380"
    stroke-width="0.9"
    stroke-opacity="0.32"
  />

  <!-- Rub el Hizb Eight-Pointed Islamic Star -->
  <rect
    x="17"
    y="17"
    width="30"
    height="30"
    rx="1.5"
    fill="#c9a35c"
    fill-opacity="0.09"
    stroke="url(#af-gold)"
    stroke-width="2.2"
  />
  <rect
    x="17"
    y="17"
    width="30"
    height="30"
    rx="1.5"
    transform="rotate(45 32 32)"
    fill="#c9a35c"
