    fill="#f4efe0"
    fill-opacity="0.96"
    stroke="url(#af-gold)"
    stroke-width="1.6"
    stroke-linejoin="round"
  />
  <path d="M32 30.8 V40.3" stroke="#b0883f" stroke-width="1.5" stroke-linecap="round" />
  <path d="M24.2 32.5 C26.6 31.6 28.8 32 30 33" stroke="#0c2b22" stroke-width="1.15" stroke-opacity="0.55" stroke-linecap="round" />
  <path d="M39.8 32.5 C37.4 31.6 35.2 32 34 33" stroke="#0c2b22" stroke-width="1.15" stroke-opacity="0.55" stroke-linecap="round" />
  <path d="M24.2 35.6 C26.6 34.8 28.8 35.2 30 36" stroke="#0c2b22" stroke-width="1.15" stroke-opacity="0.55" stroke-linecap="round" />
  <path d="M39.8 35.6 C37.4 34.8 35.2 35.2 34 36" stroke="#0c2b22" stroke-width="1.15" stroke-opacity="0.55" stroke-linecap="round" />
