  />

  <!-- Inner Sacred Sanctuary Ring -->
  <circle cx="32" cy="32" r="12.5" fill="#07201a" stroke="#e2c380" stroke-width="1.2" stroke-opacity="0.55" />

  <!-- Top Gold Star Finial -->
  <path d="M32 20.5 L33.8 23.2 L32 25.9 L30.2 23.2 Z" fill="#f0d592" />

